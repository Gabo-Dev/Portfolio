<main class="about-container" aria-labelledby="about-heading">
  <section class="content-grid section-bg-1" aria-label="Presentación del desarrollador">
    <div class="main-column">
      <app-profile-card
        [photoSrc]="profileData().photoSrc"
        [name]="profileData().name"
        [role]="profileData().role"
        [description]="profileData().description"
        [statusActive]="profileData().statusActive"
      />
    </div>
  </section>

  <section class="folder-section section-bg-3" aria-label="Más sobre Jonathan">
    <app-folder-tabs [tabs]="folderTabs()" [(activeTab)]="folderTab">
      <div class="neumorphic-card folder-body section-bg-2 elevation-medium" id="folder-panel" role="tabpanel">
        <!-- Perfil siempre renderizado (pre-cargado) -->
        <app-perfil-panel
          class="folder-content"
          [class.visible]="folderTab() === 'perfil'"
          [class.hidden]="folderTab() !== 'perfil'"
        />

        <!-- Otros tabs se renderizan solo cuando están activos -->
        @if (folderTab() === 'stack') {
          <app-stack-panel class="folder-content fade-in" />
        }
        @if (folderTab() === 'valores') {
          <app-valores-panel class="folder-content fade-in" />
        }
        @if (folderTab() === 'freelance') {
          <app-freelance-panel class="folder-content fade-in" />
        }
        @if (folderTab() === 'actual') {
          <app-actual-panel class="folder-content fade-in" />
        }
      </div>
    </app-folder-tabs>
  </section>
</main>
