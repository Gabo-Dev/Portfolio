<main class="about-container" aria-labelledby="about-heading">
  <section class="content-grid section-bg-1" aria-label="Presentación del desarrollador">
    <div class="main-column">
      <app-profile-card
        [photoSrc]="profileData().photoSrc"
        [name]="profileData().name"
        [role]="profileData().role"
        [description]="profileData().description"
        [statusActive]="profileData().statusActive"
      />
    </div>
  </section>

  <section class="folder-section section-bg-3" aria-label="Más sobre Jonathan">
    <app-folder-tabs [tabs]="folderTabs()" [activeTab]="folderTab()" (activeTabChange)="folderTab.set($event)">
      <div class="neumorphic-card folder-body section-bg-2 elevation-medium" id="folder-panel" role="tabpanel">
        <div class="folder-content" [class.hidden]="folderTab() !== 'perfil'">
          <app-perfil-panel />
        </div>
        <div class="folder-content" [class.hidden]="folderTab() !== 'stack'">
          <app-stack-panel />
        </div>
        <div class="folder-content" [class.hidden]="folderTab() !== 'valores'">
          <app-valores-panel />
        </div>
        <div class="folder-content" [class.hidden]="folderTab() !== 'freelance'">
          <app-freelance-panel />
        </div>
        <div class="folder-content" [class.hidden]="folderTab() !== 'actual'">
          <app-actual-panel />
        </div>
      </div>
    </app-folder-tabs>
  </section>
</main>
