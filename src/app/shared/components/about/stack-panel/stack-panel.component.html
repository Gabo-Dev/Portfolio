<div class="folder-content fade-in">

  <p class="stack-intro">{{ intro }}</p>

  <section class="stack-section">
    <h3 class="stack-label">Stack Tecnológico</h3>
    <div class="tech-grid">
      @for (tech of techItems; track tech.name) {
        <div class="tech-card">
          <img [src]="tech.logoUrl" [alt]="tech.name" class="tech-logo" />
          <span class="tech-name">{{ tech.name }}</span>
        </div>
      }
    </div>
  </section>

  <section class="stack-section">
    <h3 class="stack-label">Habilidades Técnicas</h3>
    <div class="skills-list">
      @for (skill of skills; track skill.name) {
        <span class="skill-chip" [ngStyle]="{ 'background-color': skill.color }">
          {{ skill.name }}
        </span>
      }
    </div>
  </section>

</div>
