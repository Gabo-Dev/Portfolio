<li class="info-item">
  <div class="info-header">
    <strong class="info-label">{{ label() }}</strong>
    @if (value(); as v) {
      <span class="info-date">{{ v }}</span>
    }
  </div>
  @if (body(); as b) {
    <p class="info-body">{{ b }}</p>
  } @else {
    <ng-content></ng-content>
  }
</li>
